<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="sesameSeedGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F5EFE6"/>
      <stop offset="85%" stop-color="#DAC7B2"/>
      <stop offset="100%" stop-color="#B39E87"/>
    </radialGradient>
    <radialGradient id="blackSesameGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <filter id="sesameShadow">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="270" rx="130" ry="20" fill="#071912" opacity="0.4"/>

  <!-- Seeds Scatter Group -->
  <g filter="url(#sesameShadow)">
    <!-- Big Teardrop Shaped Sesame Seed (Hulled White) -->
    <path d="M 180,60 C 210,60 225,95 220,135 C 215,175 190,205 160,200 C 130,195 125,160 135,120 C 145,85 160,60 180,60 Z" 
          transform="rotate(18 175 130)" fill="url(#sesameSeedGrad)" stroke="#B39E87" stroke-width="1.5"/>

    <!-- Second White Sesame Seed -->
    <path d="M 230,120 C 255,120 268,145 264,180 C 260,215 240,240 215,235 C 190,230 185,200 195,165 C 205,135 215,120 230,120 Z" 
          transform="rotate(-25 230 175)" fill="url(#sesameSeedGrad)" stroke="#B39E87" stroke-width="1.5"/>

    <!-- Black Sesame Seed Accent (High Purity) -->
    <path d="M 130,160 C 150,160 160,180 157,208 C 154,235 138,255 118,250 C 98,245 94,222 102,195 C 110,172 118,160 130,160 Z" 
          transform="rotate(35 125 205)" fill="url(#blackSesameGrad)" stroke="#374151" stroke-width="1.5"/>

    <!-- Smaller Foreground Scattering Seeds -->
    <path d="M 270,190 C 282,190 288,202 286,220 C 284,238 274,250 262,248 C 250,246 248,232 252,216 C 256,202 262,190 270,190 Z" 
          transform="rotate(45 270 220)" fill="url(#sesameSeedGrad)"/>
    <path d="M 175,230 C 187,230 193,242 191,258 C 189,274 180,285 168,283 C 156,281 154,268 158,254 C 162,242 168,230 175,230 Z" 
          transform="rotate(-15 175 255)" fill="url(#blackSesameGrad)"/>
  </g>
</svg>
