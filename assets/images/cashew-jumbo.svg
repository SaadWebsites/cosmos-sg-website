<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="nutLight" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="25%" stop-color="#FCEFD2"/>
      <stop offset="60%" stop-color="#E5C17D"/>
      <stop offset="85%" stop-color="#C29649"/>
      <stop offset="100%" stop-color="#8F6221"/>
    </radialGradient>
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E4413" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9E6E2D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E5C17D" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="200" cy="275" rx="140" ry="25" fill="#06120D" opacity="0.45" filter="url(#dropShadow)"/>

  <!-- Main Cashew Body -->
  <path d="M 180,45 
           C 255,40 330,85 345,150 
           C 358,210 320,265 245,268 
           C 185,270 140,240 145,200 
           C 150,165 195,170 215,182 
           C 235,194 255,190 262,172 
           C 272,150 255,125 220,115 
           C 185,105 160,118 142,125 
           C 125,100 140,60 180,45 Z" 
        fill="url(#nutLight)" 
        filter="url(#dropShadow)" />

  <!-- Inner Crease / Cotyledon Split Line -->
  <path d="M 175,100 
           C 220,110 248,138 245,165 
           C 242,185 225,190 210,182 
           C 190,170 152,168 146,202 
           C 142,228 178,252 230,250" 
        fill="none" 
        stroke="url(#creaseGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Realistic Kernel Specular Highlights -->
  <path d="M 195,65 C 245,62 300,95 315,138" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M 205,75 C 240,73 285,100 298,130" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 285,230 C 315,200 330,165 330,140" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Roasted / Natural Texture Freckles -->
  <circle cx="270" cy="110" r="2.5" fill="#8F6221" opacity="0.4"/>
  <circle cx="285" cy="140" r="2" fill="#8F6221" opacity="0.35"/>
  <circle cx="295" cy="180" r="3" fill="#8F6221" opacity="0.3"/>
  <circle cx="240" cy="85" r="2.2" fill="#8F6221" opacity="0.4"/>
  <circle cx="225" cy="225" r="2" fill="#8F6221" opacity="0.4"/>
</svg>
