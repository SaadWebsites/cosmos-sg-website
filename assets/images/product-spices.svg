<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="peppercornGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="35%" stop-color="#2D3748"/>
      <stop offset="80%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0F141C"/>
    </radialGradient>
    <radialGradient id="cloveHeadGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8C4F2B"/>
      <stop offset="60%" stop-color="#54280E"/>
      <stop offset="100%" stop-color="#2C1204"/>
    </radialGradient>
    <filter id="spiceShadow">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="270" rx="135" ry="18" fill="#071912" opacity="0.4"/>

  <!-- Cloves and Peppercorns Cluster -->
  <g filter="url(#spiceShadow)">
    <!-- Clove 1 (Vertical Angled) -->
    <g transform="translate(130, 90) rotate(15)">
      <!-- Stem -->
      <path d="M 12,20 L 16,95 L 8,95 L 8,20 Z" fill="#54280E" stroke="#371509" stroke-width="1"/>
      <!-- Sepals / Crown -->
      <path d="M 0,22 C 3,12 8,8 14,8 C 20,8 25,12 28,22 C 22,20 18,24 14,21 C 10,24 6,20 0,22 Z" fill="#783815"/>
      <!-- Head Ball -->
      <circle cx="14" cy="10" r="11" fill="url(#cloveHeadGrad)"/>
    </g>

    <!-- Clove 2 (Horizontal Angled) -->
    <g transform="translate(230, 150) rotate(-40)">
      <path d="M 10,18 L 14,85 L 7,85 L 7,18 Z" fill="#54280E"/>
      <path d="M 0,20 C 3,10 8,6 12,6 C 18,6 22,10 24,20 Z" fill="#783815"/>
      <circle cx="12" cy="8" r="9" fill="url(#cloveHeadGrad)"/>
    </g>

    <!-- Black Peppercorns with Wrinkled Surface -->
    <g transform="translate(190, 190)">
      <circle cx="20" cy="20" r="24" fill="url(#peppercornGrad)"/>
      <path d="M 8,14 Q 18,8 28,12" stroke="#6B7280" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M 12,26 Q 22,32 32,24" stroke="#6B7280" stroke-width="1.5" fill="none" opacity="0.3"/>
    </g>

    <g transform="translate(130, 210)">
      <circle cx="16" cy="16" r="18" fill="url(#peppercornGrad)"/>
      <path d="M 8,12 Q 16,8 24,14" stroke="#6B7280" stroke-width="1.5" fill="none" opacity="0.4"/>
    </g>

    <g transform="translate(255, 205)">
      <circle cx="15" cy="15" r="17" fill="url(#peppercornGrad)"/>
    </g>
  </g>
</svg>
